version: '3.8'

services:
  app:
    build: .
    container_name: iiagents-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/IIAgents
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/iiagents
      - OPENAI_API_KEY=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
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "sleep 5 &&
      poetry run gunicorn -k uvicorn.workers.UvicornWorker -w 1
      -t 300 -b 0.0.0.0:8000 src.api.service:app"

  postgres:
    image: postgres:15-alpine
    container_name: iiagents-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - DB_SKIP_CREATE_IF_EXISTS=true
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=iiagents
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iiagents"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: